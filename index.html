<!DOCTYPE html>
<link rel="manifest" href="app.webmanifest">
<style>
:root {
  line-height: 1.75;
  background-color: grey;
  overflow-y: scroll;
}

main {
  outline: 1px solid;
  outline-color: black;
  outline-offset: -1px;
  margin-left: auto;
  margin-right: auto;
  max-width: 51rem;
  padding-top: 5.75rem;
  padding-bottom: 5.75rem;
  background-color: white;
}

[contenteditable]:focus {
  outline: none;
}

[contenteditable] {
  text-wrap: wrap;
  max-width: 39rem; 
  margin: auto;
}

.filelist {
  width: fit-content;
  li {
    list-style-type: '🗑️';
  }
}
</style>
<input id="$filename">
<button onclick="load()">Load</button>
<button onclick="save()">Save</button>
<button onclick="list()">List</button>
<pre><ul class="filelist" id="$filelist"></ul></pre>
<main onclick="$article.focus()"><article contenteditable="plaintext-only" id="$article" autofocus></article></main>
<script>
const args = new URLSearchParams(document.location.search);
if (args.get('file')) {
  $filename.value = args.get('file');
  load();
}
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
async function save() {
  const root = await navigator.storage.getDirectory();
  const filehandle = await root.getFileHandle($filename.value, { create: true });
  const filewritable = await filehandle.createWritable();
  await filewritable.write($article.textContent);
  await filewritable.close();
  if ($filelist.textContent) list();
  window.history.pushState(null, '', '?file=' + $filename.value);
}
async function load() {
  const root = await navigator.storage.getDirectory();
  const filehandle = await root.getFileHandle($filename.value);
  const file = await filehandle.getFile();
  $article.textContent = await file.text();
  window.history.pushState(null, '', '?file=' + $filename.value);
}
async function list() {
  let str = '';
  const root = await navigator.storage.getDirectory();
  for await (const [name, handle] of root.entries()) {
    if (handle.kind === 'file') {
        str += '<li onclick="kill(event)"><a onclick="event.stopPropagation();" href="?file=' + name + '">' + name + '</a></li>';
    }
  }
  $filelist.innerHTML = str ? str : '(empty)';
}
async function kill(e) {
  const name = e.target.textContent;
  if (!confirm('Delete ' + e.target.textContent + '?')) return;
  const root = await navigator.storage.getDirectory();
  await root.removeEntry(name, { recursive: true });
  list();
}
</script>
